name: PR CI

on:
  pull_request:

permissions:
  contents: read
  code-quality: write

env:
  CONFIGURATION: Release
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_COVERAGE_TELEMETRY_OPTOUT: 1

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build src/Avalonia.Markup.Declarative.slnx -c "${{ env.CONFIGURATION }}" -p:Version=0.0.1-pr.${{ github.run_id }}

      - name: Pack NuGet packages
        run: dotnet pack src/Avalonia.Markup.Declarative.slnx -c "${{ env.CONFIGURATION }}" -p:Version=0.0.1-pr.${{ github.run_id }}

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: src/**/*.nupkg
          if-no-files-found: error

      - name: Test with code coverage
        run: >-
          dotnet test src/Avalonia.Markup.Declarative.slnx
          -c "${{ env.CONFIGURATION }}"
          --no-build
          --coverage
          --coverage-output-format cobertura

      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: src/**/*.cobertura.xml
          fail_below_min: false
          format: text
          output: console
          thresholds: '60 80'
