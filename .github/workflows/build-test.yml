name: Build & Test

on:
  workflow_call:
    inputs:
      version:
        description: 'Package Version'
        default: '0.0.1-alpha.1'
        required: false
        type: string
      timeout_minutes:
        type: number
        required: false
        default: 30

permissions:
  contents: read

env:
  CONFIGURATION: Release
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build & Test
    timeout-minutes: ${{ inputs.timeout_minutes }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: .NET Build
      run: dotnet build src -c "$CONFIGURATION" -p:Version="${{ inputs.version }}"

    - name: .NET Test
      run: |
        dotnet test src \
        -c "$CONFIGURATION" \
        --no-build \
        --report-xunit-trx \
        --report-xunit-trx-filename test-results.trx \
        --coverage \
        --coverage-output-format cobertura \
        --coverage-output coverage.cobertura.xml

    - name: .NET Pack
      run: dotnet pack src --no-build -c "$CONFIGURATION" -p:Version="${{ inputs.version }}"

    - name: .NET Pack Templates
      run: dotnet pack Templates/Declarative.Avalonia.Templates/Declarative.Avalonia.Templates.csproj -c "$CONFIGURATION" -p:Version="${{ inputs.version }}"

    - name: Upload NuGet Packages
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: |
          **/*.nupkg
          **/*.snupkg
        if-no-files-found: error
